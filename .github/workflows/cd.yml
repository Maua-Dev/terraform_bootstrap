name: CD for bootstrap deploy

on:
  push:
    branches:
      - dev
      - homolog
      - prod

jobs:
  BootstrapBucketCreation:
    name: Bootstrap (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: contains(fromJSON('["dev","homolog","prod"]'), github.ref_name)
    permissions:
      id-token: write
      contents: read

    outputs:
      s3_bucket_name: ${{ steps.bootstrap.outputs.s3_bucket_name }}
      dynamo_table_name: ${{ steps.bootstrap.outputs.dynamo_table_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set AWS account and region for branch
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
              ;;
            homolog)
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOMOLOG }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
              ;;
            prod)
              echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Branch não mapeada."
              exit 1
              ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: github-action-terraform-bootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TFE_API_TOKEN }}
          terraform_wrapper: false

      - name: Bootstrap S3 state backend (this repo)
        id: bootstrap
        shell: bash
        working-directory: ./terraform
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail

          # Mesmo bucket/tabela que o módulo cria (outputs). Key separada para o state do próprio bootstrap.
          WORKSPACE_BUCKET="tf-org-workspace-state-${AWS_ACCOUNT_ID}"
          WORKSPACE_TABLE="tf-org-workspace-locks-${AWS_ACCOUNT_ID}"
          STATE_KEY="bootstrap/terraform.tfstate"

          backend_init() {
            terraform init -input=false \
              -backend-config="bucket=${WORKSPACE_BUCKET}" \
              -backend-config="key=${STATE_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="dynamodb_table=${WORKSPACE_TABLE}" \
              "$@"
          }

          if aws s3api head-bucket --bucket "${WORKSPACE_BUCKET}" 2>/dev/null; then
            echo "Backend: s3://${WORKSPACE_BUCKET}/${STATE_KEY} (locks: ${WORKSPACE_TABLE})"
            backend_init
          else
            echo "Primeiro bootstrap nesta conta: apply com state local, depois migração para s3://${WORKSPACE_BUCKET}/${STATE_KEY}"
            terraform init -backend=false -input=false
            terraform apply -auto-approve -input=false \
              -var="aws_account_id=${AWS_ACCOUNT_ID}" \
              -var="aws_region=${AWS_REGION}"
            # -reconfigure evita restos do init -backend=false confundirem o backend S3
            backend_init -reconfigure -migrate-state
          fi

          terraform apply -auto-approve -input=false \
            -var="aws_account_id=${AWS_ACCOUNT_ID}" \
            -var="aws_region=${AWS_REGION}"

          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "dynamo_table_name=$(terraform output -raw dynamodb_table_name)" >> "$GITHUB_OUTPUT"
